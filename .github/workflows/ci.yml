name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run build
      - run: pip install -r backend/requirements.txt pip-audit
      - run: cd backend && pytest -q
      - run: cd backend && DATABASE_URL=sqlite:///./ci.db alembic upgrade head && DATABASE_URL=sqlite:///./ci.db alembic check
      - run: cd backend && python -m pip check && pip-audit -r requirements.txt
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci
      - run: cd frontend && npm test
      - run: cd frontend && npm run build
      - run: cd frontend && npm audit --audit-level=high
